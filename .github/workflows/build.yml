name: Build nxnative IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install tools
        run: |
          brew install xcodegen zstd spirv-cross
          pip install lz4 capstone fonttools backports.zstd gdown

      - name: Show disk space
        run: df -h /

      - name: Extract prod.keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          if [ -z "$PROD_KEYS" ]; then
            echo "PROD_KEYS secret is missing"
            exit 1
          fi
          mkdir -p ~/.switch
          echo "$PROD_KEYS" | base64 --decode > ~/.switch/prod.keys

      - name: Download game
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
        run: |
          if [ -z "$GAME_URL" ]; then
            echo "GAME_URL secret is missing"
            exit 1
          fi
          mkdir -p game
          gdown "$GAME_URL" -O game/
          ls -lh game
          df -h /

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py game -k ~/.switch/prod.keys

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: game/*.ipa
          retention-days: 1
          if-no-files-found: error
