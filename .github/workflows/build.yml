name: Build nxnative IPA
on:
workflow_dispatch:
jobs:
build:
runs-on: macos-14
steps:
- name: Checkout NXNative Repository
uses: actions/checkout@v4
with:
submodules: recursive
- name: Setup Xcode
uses: maxim-lobanov/setup-xcode@v1
with:
xcode-version: '15.4'
- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: '3.10'
- name: Install Dependencies & Build Tools
run: |
python -m pip install --upgrade pip
pip install requests pycryptodome
brew install cmake ninja
- name: Setup prod.keys Secret
env:
PROD_KEYS: ${{ secrets.PROD_KEYS }}
run: |
mkdir -p ~/.switch
if [ -n "$PROD_KEYS" ]; then
echo "$PROD_KEYS" \vert{} base64 --decode > ~/.switch/prod.keys 2>/dev/null \vert{}\vert{} echo "$PROD_KEYS" > ~/.switch/prod.keys
fi
- name: Download ROM from GAME_URL Secret
env:
GAME_URL: ${{ secrets.GAME_URL }}
run: |
if [ -n "$GAME_URL" ]; then
echo "Downloading game dump..."
python -c "
import os, urllib.request, re
url = os.environ.get('GAME_URL', '')
if 'drive.google.com' in url:
file_id = re.search(r'd/([a-zA-Z0-9_-]+)', url).group(1)
dl_url = f'https://drive.google.com/uc?export=download&id={file_id}'
urllib.request.urlretrieve(dl_url, 'game.nsp')
elif url:
urllib.request.urlretrieve(url, 'game.nsp')
"
fi
- name: Build nxnative App & Pack IPA
run: |
mkdir -p build && cd build
# Detect CMake or raw Xcode generation
if [ -f ../CMakeLists.txt ]; then
cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
ninja
else
echo "Running default xcodebuild fallback..."
xcodebuild -scheme nxnative -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO || true
fi
cd ..
mkdir -p Payload
# Find generated .app bundle dynamically
APP_PATH=$(find . -name ".app" -not -path "/Payload/*" -print -quit)
if [ -n "$APP_PATH" ]; then
cp -r "$APP_PATH" Payload/
zip -r nxnative-game.ipa Payload
else
echo "Failed to locate compiled .app bundle"
exit 1
fi
- name: Upload Finished IPA Artifact
uses: actions/upload-artifact@v4
with:
name: nxnative-game-ipa
path: nxnative-game.ipa
