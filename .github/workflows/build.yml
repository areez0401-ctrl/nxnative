name: Build nxnative IPA
on:
  workflow_dispatch:
    inputs:
      update_version:
        description: "Update version number from the update file name (leave empty for none)"
        required: false
        default: ""
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install tools
        run: |
          brew install xcodegen zstd spirv-cross glslang
          pip install lz4 capstone fonttools backports.zstd

      - name: Show disk space
        run: df -h /

      - name: Extract prod.keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          if [ -z "$PROD_KEYS" ]; then
            echo "PROD_KEYS secret is missing"
            exit 1
          fi
          mkdir -p ~/.switch
          echo "$PROD_KEYS" | base64 --decode > ~/.switch/prod.keys

      - name: Download game
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
        run: |
          if [ -z "$GAME_URL" ]; then
            echo "GAME_URL secret is missing"
            exit 1
          fi
          URL="${GAME_URL/dl=0/dl=1}"
          case "$URL" in
            *dl=1*) ;;
            *\?*) URL="$URL&dl=1" ;;
            *) URL="$URL?dl=1" ;;
          esac
          mkdir -p game
          OUT="game/Pokemon Legends Z-A [0100F43008C44000][v0].xci"
          curl -L --fail --silent --show-error -o "$OUT" "$URL"
          SIZE=$(stat -f%z "$OUT")
          echo "Downloaded bytes: $SIZE"
          if [ "$SIZE" -lt 100000000 ]; then
            echo "File is too small, the download failed"
            exit 1
          fi
          df -h /

      - name: Download update (optional)
        if: ${{ inputs.update_version != '' }}
        env:
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          UPDATE_VERSION: ${{ inputs.update_version }}
        run: |
          if [ -z "$UPDATE_URL" ]; then
            echo "UPDATE_URL secret is missing"
            exit 1
          fi
          URL="${UPDATE_URL/dl=0/dl=1}"
          case "$URL" in
            *dl=1*) ;;
            *\?*) URL="$URL&dl=1" ;;
            *) URL="$URL?dl=1" ;;
          esac
          OUT="game/Pokemon Legends Z-A [0100F43008C44800][v${UPDATE_VERSION}].nsp"
          curl -L --fail --silent --show-error -o "$OUT" "$URL"
          SIZE=$(stat -f%z "$OUT")
          echo "Update bytes: $SIZE"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "Update file is too small, the download failed"
            exit 1
          fi
          ls -lh game
          df -h /

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py game -k ~/.switch/prod.keys --allow-other-metal

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: game/*.ipa
          retention-days: 1
          if-no-files-found: error
