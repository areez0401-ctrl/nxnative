name: Build nxnative IPA
on:
workflow_dispatch:
jobs:
build:
runs-on: macos-14
steps:
- name: Checkout NXNative Repository
uses: actions/checkout@v4
with:
submodules: recursive
- name: Setup Xcode
uses: maxim-lobanov/setup-xcode@v1
with:
xcode-version: '15.4'
- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: '3.10'
- name: Install Dependencies & Tools
run: |
python -m pip install --upgrade pip
pip install requests pycryptodome
brew install cmake ninja
- name: Fetch prod.keys from GitHub Secrets
env:
PROD_KEYS: ${{ secrets.PROD_KEYS }}
run: |
mkdir -p ~/.switch
echo "$PROD_KEYS" | base64 --decode > ~/.switch/prod.keys
echo "$PROD_KEYS" | base64 --decode > prod.keys
- name: Download ROM from Direct URL / Google Drive
env:
GAME_URL: ${{ secrets.GAME_URL }}
run: |
echo "Downloading game dump..."
python -c "
import os, urllib.request
url = os.environ.get('GAME_URL')
if 'drive.google.com' in url:
import re
file_id = re.search(r'd/([a-zA-Z0-9_-]+)', url).group(1)
dl_url = f'https://drive.google.com/uc?export=download&id={file_id}'
urllib.request.urlretrieve(dl_url, 'game.nsp')
else:
urllib.request.urlretrieve(url, 'game.nsp')
"
- name: Build nxnative App & Pack IPA
run: |
echo "Building native iOS binary..."
mkdir -p build && cd build
cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
ninja
cd ..
mkdir -p Payload
cp -r build/nxnative.app Payload/
zip -r nxnative-game.ipa Payload
- name: Upload Finished IPA Artifact
uses: actions/upload-artifact@v4
with:
name: nxnative-game-ipa
path: nxnative-game.ipa
