name: Build nxnative IPA
on:
  workflow_dispatch:
    inputs:
      game_version:
        description: "Version number of the game file (2.0.2 = 393216)"
        required: true
        default: "393216"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install tools
        run: |
          brew install xcodegen zstd spirv-cross glslang
          pip install lz4 capstone fonttools backports.zstd gdown

      - name: Show disk space
        run: df -h /

      - name: Extract prod.keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          if [ -z "$PROD_KEYS" ]; then
            echo "PROD_KEYS secret is missing"
            exit 1
          fi
          mkdir -p ~/.switch
          echo "$PROD_KEYS" | base64 --decode > ~/.switch/prod.keys

      - name: Download game
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
        run: |
          if [ -z "$GAME_URL" ]; then
            echo "GAME_URL secret is missing"
            exit 1
          fi
          mkdir -p game
          gdown "$GAME_URL" -O game/
          ls -lh game
          df -h /

      - name: Name the game file
        env:
          GAME_VERSION: ${{ inputs.game_version }}
        run: |
          cd game
          FILE=$(ls -S | head -n 1)
          EXT="${FILE##*.}"
          case "$EXT" in
            xci|nsp) ;;
            *) echo "Unsupported file type: $EXT"; exit 1 ;;
          esac
          SIZE=$(stat -f%z "$FILE")
          if [ "$SIZE" -lt 100000000 ]; then
            echo "File is too small, the download failed"
            exit 1
          fi
          NEW="Pokemon Legends Z-A [0100F43008C44000][v${GAME_VERSION}].${EXT}"
          if [ "$FILE" != "$NEW" ]; then
            mv "$FILE" "$NEW"
          fi
          ls -lh

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py game -k ~/.switch/prod.keys --allow-other-metal

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: game/*.ipa
          retention-days: 1
          if-no-files-found: error
