name: Build nxnative iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect repo layout
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name CMakeLists.txt -not -path "*/.git/*"

      - name: Setup Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CMake and Ninja
        run: |
          brew install cmake ninja
          cmake --version
          ninja --version

      - name: Extract prod.keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          if [ -n "$PROD_KEYS" ]; then
            mkdir -p ~/.switch
            echo "$PROD_KEYS" | base64 --decode > ~/.switch/prod.keys
            echo "prod.keys extracted"
          else
            echo "PROD_KEYS secret not set, skipping"
          fi

      - name: Configure and build with CMake
        run: |
          SRC_DIR=$(find . -maxdepth 3 -name CMakeLists.txt -not -path "*/.git/*" -not -path "*/build/*" | head -n 1 | xargs dirname)
          if [ -z "$SRC_DIR" ]; then
            echo "No CMakeLists.txt found anywhere in the repo"
            exit 1
          fi
          echo "Using source dir: $SRC_DIR"
          cmake -S "$SRC_DIR" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "*.app" -type d -maxdepth 6 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build output"
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          rm -rf Payload nxnative-app.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry nxnative-app.ipa Payload
          ls -lh nxnative-app.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-app
          path: nxnative-app.ipa
          if-no-files-found: error
