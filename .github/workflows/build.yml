
name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Show build environment
        run: |
          xcodebuild -version
          python --version

      - name: Build iOS application
        run: |
          mkdir -p build

          if [ -f nxnative.xcworkspace/contents.xcworkspacedata ]; then
            xcodebuild \
              -workspace nxnative.xcworkspace \
              -scheme nxnative \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              build
          elif [ -f nxnative.xcodeproj/project.pbxproj ]; then
            xcodebuild \
              -project nxnative.xcodeproj \
              -scheme nxnative \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            echo "No nxnative.xcworkspace or nxnative.xcodeproj found."
            exit 1
          fi

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found."
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/

          cd build/ipa
          zip -r ../../nxnative.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: nxnative.ipa
          if-no-files-found: error
          retention-days: 7
