name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      update_version:
        description: "Update version number (2.0.2 = 393216). Leave empty to build the base game only"
        required: false
        type: string
        default: "393216"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350
    env:
      DM_GAME: "0100F43008C44000"

    steps:
      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross glslang unar
          python -m pip install --upgrade pip
          python -m pip install lz4 capstone fonttools backports.zstd

      - name: Extract prod.keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROD_KEYS:-}" ]; then
            echo "::error::PROD_KEYS secret is missing"
            exit 1
          fi
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"
          echo "$PROD_KEYS" | base64 --decode > "$WORK/prod.keys"
          chmod 600 "$WORK/prod.keys"
          test -s "$WORK/prod.keys"

      - name: Download game files from Dropbox
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          UPDATE_VERSION: ${{ inputs.update_version }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          fetch() {
            local url="$1"
            local out="$2"
            url="${url/dl=0/dl=1}"
            case "$url" in
              *dl=1*) ;;
              *\?*) url="$url&dl=1" ;;
              *) url="$url?dl=1" ;;
            esac
            curl -L --fail --silent --show-error -o "$out" "$url"
            local size
            size=$(stat -f%z "$out")
            echo "Downloaded $(basename "$out"): $size bytes"
            if [ "$size" -lt 10000000 ]; then
              echo "::error::File is too small, so the download probably failed"
              exit 1
            fi
          }

          if [ -z "${GAME_URL:-}" ]; then
            echo "::error::GAME_URL secret is missing"
            exit 1
          fi
          fetch "$GAME_URL" "$WORK/game.download"

          if [ -n "${UPDATE_VERSION:-}" ]; then
            if [ -z "${UPDATE_URL:-}" ]; then
              echo "::error::UPDATE_URL secret is missing"
              exit 1
            fi
            fetch "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No update version given, building the base game only"
          fi

      - name: Prepare game packages
        env:
          BASE_ID: "0100F43008C44000"
          UPDATE_ID: "0100F43008C44800"
          UPDATE_VERSION: ${{ inputs.update_version }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python3 - "$WORK" "$GAME_DIR" <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          base_id = os.environ["BASE_ID"]
          upd_id = os.environ["UPDATE_ID"]
          upd_ver = os.environ["UPDATE_VERSION"]

          RAR = (b"Rar!\x1a\x07\x00", b"Rar!\x1a\x07\x01\x00")

          def sniff(path):
              with path.open("rb") as f:
                  head = f.read(8)
                  f.seek(0x100)
                  mid = f.read(4)
              if any(head.startswith(m) for m in RAR):
                  return "rar"
              if head[:4] == b"PFS0":
                  return "nsp"
              if mid == b"HEAD":
                  return "xci"
              return None

          def standard_name(label, ext):
              if label == "game":
                  return f"Pokemon Legends Z-A [{base_id}][v0].{ext}"
              return f"Pokemon Legends Z-A [{upd_id}][v{upd_ver}].nsp"

          def handle(label):
              src = work / f"{label}.download"
              if not src.exists():
                  print(f"{label}: nothing to do")
                  return
              kind = sniff(src)
              print(f"{label}: detected type = {kind}")
              if label == "update" and kind == "xci":
                  raise SystemExit("The update must be an NSP, not an XCI.")
              if kind == "rar":
                  out = work / f"extracted-{label}"
                  out.mkdir(parents=True, exist_ok=True)
                  subprocess.run(
                      ["unar", "-o", str(out), str(src)], check=True
                  )
                  pkgs = sorted(
                      p for p in out.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in (".nsp", ".xci")
                  )
                  if not pkgs:
                      raise SystemExit(
                          f"{label}: the RAR has no .nsp or .xci inside"
                      )
                  if len(pkgs) == 1:
                      ext = pkgs[0].suffix.lower().lstrip(".")
                      shutil.move(
                          str(pkgs[0]),
                          str(game_dir / standard_name(label, ext)),
                      )
                  else:
                      for p in pkgs:
                          shutil.move(str(p), str(game_dir / p.name))
              elif kind in ("nsp", "xci"):
                  shutil.move(
                      str(src),
                      str(game_dir / standard_name(label, kind)),
                  )
              else:
                  raise SystemExit(
                      f"{label}: this is not a RAR, NSP or XCI file. "
                      "Check the Dropbox link."
                  )

          handle("game")
          handle("update")

          print("=== Prepared packages ===")
          for p in sorted(game_dir.iterdir()):
              print(f"{p.name}: {p.stat().st_size:,} bytes")
          PY

      - name: Check tools and script options
        shell: bash
        run: |
          git log -1 --oneline || true
          for t in xcodegen spirv-cross zstd unar glslangValidator xcrun; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "found: $t"
            else
              echo "MISSING: $t"
            fi
          done
          df -h /
          python3 scripts/build_ipa_from_nsp.py --help || true

      - name: Update shader toolchain lock
        shell: bash
        run: |
          set -euo pipefail
          CHAIN="$(find . -name dmsh_chain.py -type f -print -quit)"
          if [ -z "$CHAIN" ]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi
          echo "Using $CHAIN for profile $DM_GAME"
          python3 "$CHAIN" --update-lock
          python3 "$CHAIN" --header || echo "--header did not run, continuing"

      - name: Build IPA
        shell: bash
        run: |
          set +e
          set -o pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          LOG="$RUNNER_TEMP/build.log"

          HELP="$(python3 scripts/build_ipa_from_nsp.py --help 2>&1 || true)"
          EXTRA_FLAGS=""
          case "$HELP" in
            *"--allow-other-metal"*)
              EXTRA_FLAGS="--allow-other-metal"
              echo "This script supports --allow-other-metal, using it"
              ;;
            *)
              echo "This script has no --allow-other-metal option, skipping it"
              ;;
          esac

          run_build() {
            python3 scripts/build_ipa_from_nsp.py "$GAME_DIR" -k "$WORK/prod.keys" $1 2>&1 | tee "$LOG"
            return ${PIPESTATUS[0]}
          }

          if ! run_build "$EXTRA_FLAGS"; then
            if grep -q -- "--provisional" "$LOG"; then
              echo "The script asked for --provisional, retrying with it"
              if ! run_build "$EXTRA_FLAGS --provisional"; then
                echo "::error::The build failed, see the log above"
                exit 1
              fi
            else
              echo "::error::The build failed, see the log above"
              exit 1
            fi
          fi

          IPA="$(find "$GAME_DIR" -maxdepth 2 -name '*.ipa' | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::The build finished but no IPA was found"
            exit 1
          fi
          cp "$IPA" "$RUNNER_TEMP/NxNative.ipa"
          ls -lh "$RUNNER_TEMP/NxNative.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: ${{ runner.temp }}/GameFiles/*_build/logs/
          if-no-files-found: ignore
          retention-days: 1

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/nxnative" "$RUNNER_TEMP/GameFiles"
