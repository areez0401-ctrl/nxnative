name: Build nxnative IPA
on:
workflow_dispatch:
push:
branches:
- no-bc
jobs:
build:
runs-on: macos-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4
- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.10'
- name: Install Dependencies
run: |
python -m pip install --upgrade pip
pip install requests
- name: Load Secrets and Prepare Build
env:
PROD_KEYS: ${{ secrets.PROD_KEYS }}
GAME_URL: ${{ secrets.GAME_URL }}
run: |
echo "$PROD_KEYS" > prod.keys
echo "GAME_URL=$GAME_URL" >> $GITHUB_ENV
- name: Run Build Process
run: |
echo "Starting nxnative build..."
- name: Upload IPA Artifact
uses: actions/upload-artifact@v4
with:
name: nxnative-game-ipa
path: "*.ipa"
